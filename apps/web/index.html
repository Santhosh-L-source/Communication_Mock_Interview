<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="AI-powered placement communication readiness platform" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to API and Supabase for faster initial requests -->
    <link rel="preconnect" href="http://localhost:4001" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:4001" />
    <link rel="preconnect" href="https://jqdbewyhuozkyhsfgjjz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://jqdbewyhuozkyhsfgjjz.supabase.co" />

    <!-- Module preload added by Vite at build time -->

    <title>SpeakReady - AI Interview Platform</title>

    <!-- Inline loading styles to show immediately -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #1d4ed8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Show loading immediately while JS loads -->
    <div id="app-loading">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
